name: Kalshi refresh

# Re-prices Kalshi contracts against the sportsbook lines already in site/data.json.
# Uses 0 Odds API credits (Kalshi's API is free), so it can run often on game days.
on:
  schedule:
    - cron: "30 */3 * * 4,5,6,0,1"   # every 3 hours, Thursday through Monday (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run --kalshi-only
      - name: Commit
        run: |
          git config user.name "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "kalshi refresh" && git pull --rebase && git push)
