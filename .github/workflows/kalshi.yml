name: Kalshi refresh

# Re-prices Kalshi contracts against the sportsbook lines already in site/data.json, drops finished games and
# adds the upcoming week's games from the free schedule (Odds API /events = 0 credits, or ESPN). 0 credits.
on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 hours, every day: also rolls the page to the next week's slate
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.run --kalshi-only
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # only the free /events schedule list (0 credits)
      - name: Commit
        run: |
          git config user.name "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || (git commit -m "kalshi refresh" && git pull --rebase && git push)
