name: NFL edge scan

on:
  schedule:
    # Thursday ~noon ET: whole week's slate. Sunday ~12:15pm ET: after inactives, before 1pm kickoffs.
    # (GitHub cron is UTC and can run a few minutes late.)
    - cron: "0 16 * * 4"
    - cron: "15 16 * * 0"
  workflow_dispatch:
    inputs:
      window_hours:
        description: "Only scan games starting within this many hours (use 6 for a single night game)"
        required: false
        default: "110"
      markets:
        description: "Player markets, comma-separated (blank = default 6, none = game lines only). ~1 credit per market per game"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Thursday: whole week, 6 player markets (rushing, receiving, passing yards, receptions, completions,
          # anytime TD) + moneyline/spread/total (3 credits). Sunday: game lines only (3 credits, after
          # inactives); player props carry over from Thursday. Fits 500 credits in every month (README).
          WINDOW_HOURS: ${{ github.event.inputs.window_hours || (github.event.schedule == '15 16 * * 0' && '36' || '110') }}
          ODDS_MARKETS: ${{ github.event.inputs.markets || (github.event.schedule == '15 16 * * 0' && 'none' || '') }}
        run: python -m src.run
      - name: Save pick log
        run: |
          git config user.name "edge-bot"
          git config user.email "edge-bot@users.noreply.github.com"
          git add -A site data
          git diff --cached --quiet || (git commit -m "log picks" && git pull --rebase && git push)
